name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, código morto e arquitetura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci .
      - name: Knip
        run: npm run knip
      - name: Contrato de arquitetura
        run: npm run arquitetura
      - name: Questões sem resposta entregue
        run: npm run questoes
      - name: Commits no padrão (commitlint)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Build
        run: npm run build
